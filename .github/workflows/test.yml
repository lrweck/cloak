name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Read from go.mod, so there is no second place to forget. This file used to
          # carry a literal version; at 1.23 the run only passed because GOTOOLCHAIN=auto
          # silently fetched a newer toolchain, so CI was never testing what it declared.
          go-version-file: go.mod
      - run: go test ./...
      - run: go test -race ./...
      # The fast key path must never mask less than the regexp it replaces. That is the
      # one invariant whose violation is a silent leak, so it is fuzzed rather than
      # trusted. Short runs: the seed corpus carries the load, this only catches the
      # inputs nobody thought of.
      - run: go test -run '^$' -fuzz '^FuzzKeyRegexFastPathNeverMasksLess$' -fuzztime=20s .
      - run: go test -run '^$' -fuzz '^FuzzKeyRegexRuleNoPanic$' -fuzztime=10s .
