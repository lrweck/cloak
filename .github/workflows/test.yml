name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Must match go.mod. At 1.23 the run only passed because GOTOOLCHAIN=auto
          # silently fetched a newer toolchain, so CI was never testing what it
          # declared.
          go-version: '1.27'
      - run: go test ./...
      - run: go test -race ./...
