name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Read from go.mod rather than written here. A literal version in two places is
          # two places to forget: GOTOOLCHAIN=auto silently fetching a newer toolchain
          # than the module declares means CI never tested what it claimed to.
          go-version-file: go.mod

      # The official action, so the binary is fetched and run on the runner. Installing
      # golangci-lint into the workflow's own Go path would pin a version in two places
      # and mean something different from what every other Go project runs.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # latest, not a pin. A linter upgrade should be a deliberate bump, but a stale
          # pin is worse: it is a gate running rules from a release that no longer gets
          # fixes.
          version: latest
          args: --timeout=5m

      # Measured on the library alone. `./...` pulls in examples/, which are runnable
      # demos with nothing to cover, and they drag the total from 93.4% to 85.9%.
      - name: coverage
        run: go test -coverprofile=cover.out -covermode=atomic .

      # Coverage moving is expected; coverage falling is the signal.
      - name: enforce the coverage floor
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print $NF}' | tr -d '%')
          echo "cobertura: ${total}%"
          floor=90
          awk -v t="$total" -v f="$floor" 'BEGIN { exit (t+0 >= f+0) ? 0 : 1 }' || {
            echo "cobertura ${total}% abaixo do piso de ${floor}%"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: cover.out
          path: cover.out
          if-no-files-found: error

  # The coverage badge has no third-party service behind it, so nothing would ever
  # correct it: a shields.io URL with the number typed into it is a claim, not a
  # measurement, and it would keep claiming 93.4% after the coverage fell. This job
  # rewrites the number, and only when it moved.
  #
  # `[skip ci]` on the commit is what stops the loop — otherwise this job's own push
  # re-triggers it and commits the same number forever.
  badge:
    needs: lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -coverprofile=cover.out -covermode=atomic .
      - name: rewrite the badge only when the number moved
        run: |
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {print $NF}' | tr -d '%')
          echo "cobertura: ${pct}%"
          sed -i -E "s|badge/coverage-[0-9.]+%25-|badge/coverage-${pct}%25-|" README.md
          if git diff --quiet -- README.md; then
            echo "badge ja estava em ${pct}%"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: cobertura em ${pct}% [skip ci]"
          git push