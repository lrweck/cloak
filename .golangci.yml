# golangci-lint is what Go Report Card used to be, now maintained. goreportcard.com was
# sunset on 2026-07-01 after losing its infrastructure sponsor, and the maintainers
# pointed users here.
#
# This file keeps the gate small on purpose. The default set already covers the classes
# that have bitten this repository: a deprecated API in a test, dead declarations, and
# ineffectual assignments.
version: "2"

linters:
  default: standard
  exclusions:
    generated: lax
    rules:
      # De Morgan's law is a style opinion, not a defect, and in this repository the
      # negated form is the readable one: `!(d[0] == '0' && d[1] == '0')` says "not all
      # three are zero", which is what the check means.
      - text: "QF1001"
        linters:
          - staticcheck
      # SA1000 fires on regexp.Compile("[unclosed") in regexkey_test.go, which is
      # deliberately invalid so the error path is covered. Asserted inline there too;
      # this is the belt to that braces.

formatters:
  enable:
    - gofmt

issues:
  # A third-party rule is not a reason to block a merge on its own.
  max-issues-per-linter: 0
  max-same-issues: 0